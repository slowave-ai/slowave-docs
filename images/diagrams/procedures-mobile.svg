<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 954" role="img" aria-labelledby="t d">
  <title id="t">How a procedure is learned and reused</title>
  <desc id="d">A finished task is saved as a procedure with ordered steps. On a similar later task, the procedure is offered to the agent. The agent rates it, and helpful procedures are offered more often.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ca098"/>
    </marker>
  </defs>
  <rect width="640" height="954" rx="20" fill="#0f1115"/>
  <g font-family="Manrope, Inter, Arial, sans-serif" text-anchor="middle">
    <text x="320" y="48" font-size="28" font-weight="600" fill="#edf4ef">Good work becomes</text>
    <text x="320" y="82" font-size="28" font-weight="600" fill="#edf4ef">a reusable method</text>
    <rect x="40" y="124" width="560" height="150" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="156" font-size="16" font-weight="600" letter-spacing="1.5" fill="#41c76c">TASK 1</text>
    <text x="320" y="188" font-size="22" font-weight="600" fill="#edf4ef">Add an endpoint</text>
    <text x="320" y="218" font-size="18" fill="#8ca098">The agent finishes the work</text>
    <text x="320" y="242" font-size="18" fill="#8ca098">and saves how it did it</text>
    <line x1="320" y1="276" x2="320" y2="306" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="40" y="308" width="560" height="166" rx="14" fill="#171a21" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320" y="340" font-size="16" font-weight="600" letter-spacing="1.5" fill="#41c76c">PROCEDURE</text>
    <text x="210" y="374" font-size="20" font-weight="700" text-anchor="start" fill="#41c76c">1</text>
    <text x="240" y="374" font-size="20" text-anchor="start" fill="#edf4ef">Define the route</text>
    <text x="210" y="402" font-size="20" font-weight="700" text-anchor="start" fill="#41c76c">2</text>
    <text x="240" y="402" font-size="20" text-anchor="start" fill="#edf4ef">Validate input</text>
    <text x="210" y="430" font-size="20" font-weight="700" text-anchor="start" fill="#41c76c">3</text>
    <text x="240" y="430" font-size="20" text-anchor="start" fill="#edf4ef">Write tests</text>
    <text x="210" y="458" font-size="20" font-weight="700" text-anchor="start" fill="#41c76c">4</text>
    <text x="240" y="458" font-size="20" text-anchor="start" fill="#edf4ef">Update the API docs</text>
    <line x1="320" y1="476" x2="320" y2="506" stroke="#8ca098" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 6"/>
    <rect x="40" y="508" width="560" height="150" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="540" font-size="16" font-weight="600" letter-spacing="1.5" fill="#41c76c">TASK 2</text>
    <text x="320" y="572" font-size="22" font-weight="600" fill="#edf4ef">Add another endpoint</text>
    <text x="320" y="602" font-size="18" fill="#8ca098">Slowave offers the method</text>
    <text x="320" y="626" font-size="18" fill="#8ca098">as a head start</text>
    <line x1="320" y1="660" x2="320" y2="690" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="40" y="692" width="560" height="150" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="724" font-size="16" font-weight="600" letter-spacing="1.5" fill="#41c76c">FEEDBACK</text>
    <text x="320" y="756" font-size="22" font-weight="600" fill="#edf4ef">Did it help?</text>
    <text x="320" y="786" font-size="18" fill="#8ca098">Helpful methods</text>
    <text x="320" y="810" font-size="18" fill="#8ca098">are offered more</text>
    <text x="320" y="888" font-size="20" fill="#a0e3b5">Methods that fail are kept too,</text>
    <text x="320" y="916" font-size="20" fill="#a0e3b5">as warnings.</text>
  </g>
</svg>
