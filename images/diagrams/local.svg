<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Everything stays on your computer</title>
  <desc id="d">Your coding agents talk to Slowave, which stores memory in a local database on your computer. No memory is sent to a hosted memory service.</desc>
  <rect width="960" height="360" rx="20" fill="#0f1115"/>
  <g font-family="Manrope, Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="30" width="640" height="300" rx="18" fill="#12161b" stroke="#41c76c" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="60" y="64" text-anchor="start" font-size="14" font-weight="600" fill="#41c76c" letter-spacing="1.5">YOUR COMPUTER</text>

    <rect x="60" y="100" width="170" height="170" rx="14" fill="#171a21" stroke="#2c313b"/>
    <text x="145" y="150" font-size="17" font-weight="600" fill="#edf4ef">Your coding</text>
    <text x="145" y="172" font-size="17" font-weight="600" fill="#edf4ef">agents</text>
    <text x="145" y="208" font-size="13" fill="#8ca098">Claude Code, Codex,</text>
    <text x="145" y="226" font-size="13" fill="#8ca098">Cursor and more</text>

    <rect x="270" y="100" width="170" height="170" rx="14" fill="#171a21" stroke="#41c76c" stroke-width="1.5"/>
    <text x="355" y="170" font-size="19" font-weight="700" fill="#edf4ef">Slowave</text>
    <text x="355" y="198" font-size="13" fill="#8ca098">Runs quietly in</text>
    <text x="355" y="216" font-size="13" fill="#8ca098">the background</text>

    <rect x="480" y="100" width="160" height="170" rx="14" fill="#171a21" stroke="#2c313b"/>
    <text x="560" y="170" font-size="17" font-weight="600" fill="#edf4ef">Your memory</text>
    <text x="560" y="198" font-size="13" fill="#8ca098">A local database</text>
    <text x="560" y="216" font-size="13" fill="#8ca098">you can inspect</text>

    <g stroke="#8ca098" stroke-width="1.5"><line x1="232" y1="185" x2="268" y2="185"/><line x1="442" y1="185" x2="478" y2="185"/></g>

    <rect x="730" y="100" width="200" height="170" rx="14" fill="#171a21" stroke="#2c313b" stroke-dasharray="4 5"/>
    <text x="830" y="160" font-size="16" font-weight="600" fill="#8ca098">Hosted memory</text>
    <text x="830" y="182" font-size="16" font-weight="600" fill="#8ca098">service</text>
    <text x="830" y="222" font-size="13" fill="#a0e3b5">Not used. No API key.</text>
    <line x1="672" y1="185" x2="728" y2="185" stroke="#8ca098" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="700" y="172" font-size="22" fill="#e5645a">×</text>
  </g>
</svg>
