<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1168" role="img" aria-labelledby="t d">
  <title id="t">Without and with Slowave</title>
  <desc id="d">Without Slowave, every new session starts from zero and you repeat yourself. With Slowave, a rule you state once is remembered in later sessions and in other agents.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ca098"/>
    </marker>
  </defs>
  <rect width="640" height="1168" rx="20" fill="#0f1115"/>
  <g font-family="Manrope, Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="592" height="546" rx="16" fill="#12161b" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="66" font-size="26" font-weight="700" fill="#e5645a">Without memory</text>
    <rect x="60" y="92" width="520" height="76" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="125" font-size="22" font-weight="600" fill="#edf4ef">Monday</text>
    <text x="320" y="152" font-size="18" fill="#8ca098">"Always use UTC dates."</text>
    <line x1="320" y1="170" x2="320" y2="194" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="196" width="520" height="76" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="229" font-size="22" font-weight="600" fill="#edf4ef">Tuesday</text>
    <text x="320" y="256" font-size="18" fill="#8ca098">New session. Blank slate.</text>
    <line x1="320" y1="274" x2="320" y2="298" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="300" width="520" height="76" rx="14" fill="#171a21" stroke="#e5645a" stroke-width="1.5"/>
    <text x="320" y="333" font-size="22" font-weight="600" fill="#edf4ef">Tuesday result</text>
    <text x="320" y="360" font-size="18" fill="#8ca098">Local time used. Bug.</text>
    <line x1="320" y1="378" x2="320" y2="402" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="404" width="520" height="76" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="437" font-size="22" font-weight="600" fill="#edf4ef">You, again</text>
    <text x="320" y="464" font-size="18" fill="#8ca098">"I told you: UTC."</text>
    <text x="320" y="520" font-size="20" fill="#8ca098">You repeat yourself in every session.</text>
    <rect x="24" y="598" width="592" height="546" rx="16" fill="#12161b" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320" y="640" font-size="26" font-weight="700" fill="#41c76c">With Slowave</text>
    <rect x="60" y="666" width="520" height="76" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="699" font-size="22" font-weight="600" fill="#edf4ef">Monday</text>
    <text x="320" y="726" font-size="18" fill="#8ca098">"Always use UTC dates."</text>
    <line x1="320" y1="744" x2="320" y2="768" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="770" width="520" height="76" rx="14" fill="#171a21" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320" y="803" font-size="22" font-weight="600" fill="#edf4ef">Saved by Slowave</text>
    <text x="320" y="830" font-size="18" fill="#8ca098">A rule, kept on your machine</text>
    <line x1="320" y1="848" x2="320" y2="872" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="874" width="520" height="76" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="907" font-size="22" font-weight="600" fill="#edf4ef">Tuesday, any agent</text>
    <text x="320" y="934" font-size="18" fill="#8ca098">Rule recalled automatically</text>
    <line x1="320" y1="952" x2="320" y2="976" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="978" width="520" height="76" rx="14" fill="#171a21" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320" y="1011" font-size="22" font-weight="600" fill="#edf4ef">Tuesday result</text>
    <text x="320" y="1038" font-size="18" fill="#8ca098">UTC used. First try.</text>
    <text x="320" y="1094" font-size="20" fill="#a0e3b5">You say it once. Your agents remember.</text>
  </g>
</svg>
