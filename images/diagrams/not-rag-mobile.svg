<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1184" role="img" aria-labelledby="t d">
  <title id="t">A storage and retrieval system compared with Slowave</title>
  <desc id="d">A typical storage and retrieval setup stores text, fetches the closest matches and hands them to a language model. It does not learn whether the results helped. Slowave adds a feedback loop: the agent writes memories, receives relevant ones, reports what helped, and memory strengthens, fades or is replaced in the background.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ca098"/>
    </marker>
  </defs>
  <rect width="640" height="1184" rx="20" fill="#0f1115"/>
  <g font-family="Manrope, Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="24" width="592" height="520" rx="16" fill="#12161b" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="66" font-size="26" font-weight="700" fill="#8ca098">Store and fetch</text>
    <rect x="110" y="92" width="420" height="88" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320.0" y="130" font-size="22" font-weight="600" fill="#edf4ef">Stored text</text>
    <text x="320.0" y="160" font-size="18" fill="#8ca098">notes, chunks</text>
    <line x1="320" y1="182" x2="320" y2="214" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="110" y="216" width="420" height="88" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320.0" y="254" font-size="22" font-weight="600" fill="#edf4ef">Closest matches</text>
    <text x="320.0" y="284" font-size="18" fill="#8ca098">fetched per query</text>
    <line x1="320" y1="306" x2="320" y2="338" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="110" y="340" width="420" height="88" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320.0" y="378" font-size="22" font-weight="600" fill="#edf4ef">Language model</text>
    <text x="320.0" y="408" font-size="18" fill="#8ca098">reads and answers</text>
    <text x="320" y="468" font-size="18" fill="#8ca098">One direction. Memory stays as it was stored.</text>
    <text x="320" y="494" font-size="18" fill="#8ca098">It never learns whether a result helped.</text>
    <rect x="24" y="570" width="592" height="590" rx="16" fill="#12161b" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320" y="612" font-size="26" font-weight="700" fill="#41c76c">Slowave</text>
    <rect x="110" y="638" width="420" height="88" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320.0" y="676" font-size="22" font-weight="600" fill="#edf4ef">Your agent</text>
    <text x="320.0" y="706" font-size="18" fill="#8ca098">writes and uses</text>
    <line x1="150" y1="728" x2="150" y2="796" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <text x="172" y="766" font-size="18" text-anchor="start" fill="#a0e3b5">remember, feedback</text>
    <line x1="400" y1="796" x2="400" y2="728" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <text x="416" y="754" font-size="18" text-anchor="start" fill="#a0e3b5">relevant</text>
    <text x="416" y="776" font-size="18" text-anchor="start" fill="#a0e3b5">memory</text>
    <rect x="110" y="798" width="420" height="88" rx="14" fill="#171a21" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320.0" y="836" font-size="22" font-weight="600" fill="#edf4ef">Living memory</text>
    <text x="320.0" y="866" font-size="18" fill="#8ca098">on your machine</text>
    <line x1="320" y1="888" x2="320" y2="922" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="110" y="924" width="420" height="88" rx="14" fill="#171a21" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320.0" y="962" font-size="22" font-weight="600" fill="#edf4ef">Background upkeep</text>
    <text x="320.0" y="992" font-size="18" fill="#8ca098">no LLM needed</text>
    <text x="320" y="1060" font-size="20" fill="#a0e3b5">A loop. Memory strengthens, fades</text>
    <text x="320" y="1088" font-size="20" fill="#a0e3b5">or is replaced based on what</text>
    <text x="320" y="1116" font-size="20" fill="#a0e3b5">your agent actually used.</text>
  </g>
</svg>
