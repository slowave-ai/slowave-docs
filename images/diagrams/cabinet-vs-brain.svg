<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">A filing cabinet versus a brain-like memory</title>
  <desc id="d">After a year, a store-everything memory holds thousands of equal notes, old and new mixed together. A brain-like memory keeps fewer, stronger lessons, lets unused details fade and replaces outdated ones.</desc>
