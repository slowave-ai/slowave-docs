<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Without and with Slowave</title>
  <desc id="d">Without Slowave, every new session starts from zero and you repeat yourself. With Slowave, a rule you state once is remembered in later sessions and in other agents.</desc>
  <rect width="960" height="360" rx="20" fill="#0f1115"/>
  <g font-family="Manrope, Inter, Arial, sans-serif">
    <text x="240" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#e5645a">Without memory</text>
    <text x="720" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#41c76c">With Slowave</text>
    <line x1="480" y1="30" x2="480" y2="330" stroke="#2c313b"/>

    <g font-size="13" text-anchor="middle">
      <rect x="40" y="80" width="190" height="62" rx="12" fill="#171a21" stroke="#2c313b"/>
      <text x="135" y="106" fill="#edf4ef" font-weight="600">Monday</text><text x="135" y="126" fill="#8ca098">"Always use UTC dates."</text>
      <rect x="250" y="80" width="190" height="62" rx="12" fill="#171a21" stroke="#2c313b"/>
      <text x="345" y="106" fill="#edf4ef" font-weight="600">Tuesday</text><text x="345" y="126" fill="#8ca098">New session. Blank slate.</text>
      <rect x="40" y="170" width="190" height="62" rx="12" fill="#171a21" stroke="#e5645a"/>
      <text x="135" y="196" fill="#edf4ef" font-weight="600">Tuesday result</text><text x="135" y="216" fill="#8ca098">Local time used. Bug.</text>
      <rect x="250" y="170" width="190" height="62" rx="12" fill="#171a21" stroke="#2c313b"/>
      <text x="345" y="196" fill="#edf4ef" font-weight="600">You, again</text><text x="345" y="216" fill="#8ca098">"I told you: UTC."</text>
      <text x="240" y="290" fill="#8ca098">You repeat yourself in every session.</text>
    </g>

    <g font-size="13" text-anchor="middle">
      <rect x="520" y="80" width="190" height="62" rx="12" fill="#171a21" stroke="#2c313b"/>
      <text x="615" y="106" fill="#edf4ef" font-weight="600">Monday</text><text x="615" y="126" fill="#8ca098">"Always use UTC dates."</text>
      <rect x="730" y="80" width="190" height="62" rx="12" fill="#171a21" stroke="#41c76c"/>
      <text x="825" y="106" fill="#edf4ef" font-weight="600">Saved by Slowave</text><text x="825" y="126" fill="#8ca098">A rule, kept on your machine</text>
      <rect x="520" y="170" width="190" height="62" rx="12" fill="#171a21" stroke="#2c313b"/>
      <text x="615" y="196" fill="#edf4ef" font-weight="600">Tuesday, any agent</text><text x="615" y="216" fill="#8ca098">Rule recalled automatically</text>
      <rect x="730" y="170" width="190" height="62" rx="12" fill="#171a21" stroke="#41c76c"/>
      <text x="825" y="196" fill="#edf4ef" font-weight="600">Tuesday result</text><text x="825" y="216" fill="#8ca098">UTC used. First try.</text>
      <text x="720" y="290" fill="#a0e3b5">You say it once. Your agents remember.</text>
    </g>
  </g>
</svg>
