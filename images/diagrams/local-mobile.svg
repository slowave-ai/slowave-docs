<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 758" role="img" aria-labelledby="t d">
  <title id="t">Everything stays on your computer</title>
  <desc id="d">Your coding agents talk to Slowave, which stores memory in a local database on your computer. No memory is sent to a hosted memory service.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ca098"/>
    </marker>
  </defs>
  <rect width="640" height="758" rx="20" fill="#0f1115"/>
  <g font-family="Manrope, Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="28" width="592" height="516" rx="18" fill="#12161b" stroke="#41c76c" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="52" y="66" font-size="20" font-weight="600" text-anchor="start" letter-spacing="1.5" fill="#41c76c">YOUR COMPUTER</text>
    <rect x="60" y="92" width="520" height="110" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="143.0" font-size="22" font-weight="600" fill="#edf4ef">Your coding agents</text>
    <text x="320" y="171.0" font-size="18" fill="#8ca098">Claude Code, Codex, Cursor and more</text>
    <line x1="320" y1="204" x2="320" y2="248" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="250" width="520" height="110" rx="14" fill="#171a21" stroke="#41c76c" stroke-width="1.5"/>
    <text x="320" y="301.0" font-size="22" font-weight="600" fill="#edf4ef">Slowave</text>
    <text x="320" y="329.0" font-size="18" fill="#8ca098">Runs quietly in the background</text>
    <line x1="320" y1="362" x2="320" y2="406" stroke="#8ca098" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="408" width="520" height="110" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5"/>
    <text x="320" y="459.0" font-size="22" font-weight="600" fill="#edf4ef">Your memory</text>
    <text x="320" y="487.0" font-size="18" fill="#8ca098">A local database you can inspect</text>
    <line x1="320" y1="548" x2="320" y2="598" stroke="#8ca098" stroke-width="2" stroke-dasharray="3 6"/>
    <text x="352" y="582" font-size="34" text-anchor="start" fill="#e5645a">×</text>
    <rect x="60" y="614" width="520" height="120" rx="14" fill="#171a21" stroke="#2c313b" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="320" y="654" font-size="22" font-weight="600" fill="#8ca098">Hosted memory service</text>
    <text x="320" y="698" font-size="20" fill="#a0e3b5">Not used. No API key.</text>
  </g>
</svg>
